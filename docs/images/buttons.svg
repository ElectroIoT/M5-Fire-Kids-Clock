<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="Three-button controls, animated">
  <title>Button controls</title>
  <style>
    .t  { font: 800 22px 'Segoe UI', Arial, sans-serif; fill: #4A3F55; }
    .s  { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #8A7F96; }
    .k  { font: 800 16px 'Segoe UI', Arial, sans-serif; fill: #4A3F55; }
    .w  { font: 800 16px 'Segoe UI', Arial, sans-serif; fill: #FFFFFF; }
    @keyframes pressA { 0%, 8% { transform: translateY(0) } 4% { transform: translateY(5px) } 100% { transform: translateY(0) } }
    @keyframes glowA { 0%, 30% { fill: #F27BA5 } 34%, 100% { fill: #FFFFFF } }
    @keyframes glowB { 0%, 32% { fill: #FFFFFF } 36%, 64% { fill: #F27BA5 } 68%, 100% { fill: #FFFFFF } }
    @keyframes glowC { 0%, 66% { fill: #FFFFFF } 70%, 98% { fill: #F27BA5 } 100% { fill: #FFFFFF } }
    @keyframes btnA { 0%, 30% { transform: translateY(4px) } 34%, 100% { transform: translateY(0) } }
    @keyframes btnB { 0%, 32% { transform: translateY(0) } 36%, 64% { transform: translateY(4px) } 68%, 100% { transform: translateY(0) } }
    @keyframes btnC { 0%, 66% { transform: translateY(0) } 70%, 98% { transform: translateY(4px) } 100% { transform: translateY(0) } }
    .ga { animation: glowA 6s infinite; } .gb { animation: glowB 6s infinite; } .gc { animation: glowC 6s infinite; }
    .ba { animation: btnA 6s infinite; } .bb { animation: btnB 6s infinite; } .bc { animation: btnC 6s infinite; }
  </style>
  <rect width="900" height="360" rx="24" fill="#FFF8EE"/>
  <text x="450" y="42" text-anchor="middle" class="t">Three buttons, labelled on screen</text>
  <text x="450" y="66" text-anchor="middle" class="s">The pill above each button always says what it does - and turns pink while pressed</text>

  <!-- device -->
  <rect x="270" y="90" width="360" height="220" rx="26" fill="#E5484D"/>
  <rect x="300" y="104" width="300" height="150" rx="8" fill="#1E1B2E"/>
  <rect x="306" y="110" width="288" height="138" rx="4" fill="#FFF8EE"/>
  <text x="450" y="150" text-anchor="middle" class="k" style="font-size:30px;fill:#F27BA5">07:30 AM</text>
  <text x="450" y="178" text-anchor="middle" class="s">Tuesday, 17 Nov 2026</text>
  <rect class="ga" x="318" y="214" width="80" height="24" rx="12"/><text x="358" y="231" text-anchor="middle" class="k">&#9664;</text>
  <rect class="gb" x="410" y="214" width="80" height="24" rx="12"/><text x="450" y="231" text-anchor="middle" class="k">Alarms</text>
  <rect class="gc" x="502" y="214" width="80" height="24" rx="12"/><text x="542" y="231" text-anchor="middle" class="k">&#9654;</text>
  <g fill="#FFD3D5">
    <rect class="ba" x="328" y="270" width="60" height="18" rx="9"/>
    <rect class="bb" x="420" y="270" width="60" height="18" rx="9"/>
    <rect class="bc" x="512" y="270" width="60" height="18" rx="9"/>
  </g>
  <text x="358" y="306" text-anchor="middle" class="w">A</text>
  <text x="450" y="306" text-anchor="middle" class="w">B</text>
  <text x="542" y="306" text-anchor="middle" class="w">C</text>

  <!-- legend -->
  <g transform="translate(24 110)">
    <rect width="220" height="190" rx="18" fill="#FFFFFF"/>
    <text x="16" y="30" class="k" style="fill:#F27BA5">A - left</text>
    <text x="16" y="56" class="s">Home: previous item</text>
    <text x="16" y="80" class="s">Menus: up / minus</text>
    <text x="16" y="104" class="s">Alarm: SNOOZE</text>
    <text x="16" y="128" class="s">Hold: back / cancel</text>
    <text x="16" y="164" class="k" style="fill:#9B7FD1">B - middle</text>
    <text x="16" y="182" class="s">Open / OK / next / STOP</text>
  </g>
  <g transform="translate(656 110)">
    <rect width="220" height="190" rx="18" fill="#FFFFFF"/>
    <text x="16" y="30" class="k" style="fill:#52C49E">C - right</text>
    <text x="16" y="56" class="s">Home: next item</text>
    <text x="16" y="80" class="s">Menus: down / plus</text>
    <text x="16" y="104" class="s">Alarm: STOP</text>
    <text x="16" y="128" class="s">Night: hold = skip</text>
    <text x="16" y="164" class="k" style="fill:#9B7FD1">Night mode</text>
    <text x="16" y="182" class="s">Any press: 30 s peek</text>
  </g>
</svg>
