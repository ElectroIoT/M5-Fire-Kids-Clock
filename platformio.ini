[platformio]
src_dir = M5_Fire_Kids_Clock
default_envs = m5stack-fire

[env:m5stack-fire]
platform = espressif32@6.9.0
board = m5stack-fire
framework = arduino
board_build.partitions = default_16MB.csv
board_build.f_cpu = 240000000L
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    m5stack/M5Unified@0.3.0
    m5stack/M5GFX@0.3.0
    adafruit/Adafruit NeoPixel@1.15.5
