[platformio]
src_dir = M5_Fire_Kids_Clock
default_envs = m5stack-fire

[env:m5stack-fire]
platform = espressif32@6.9.0
board = m5stack-fire
framework = arduino
board_build.partitions = default_16MB.csv
board_build.f_cpu = 240000000L
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    m5stack/M5Unified@0.3.0
    m5stack/M5GFX@0.3.0
    adafruit/Adafruit NeoPixel@1.15.5

; ---- Phase A spike: Bluetooth LE memory cost (not for normal use) ----------
; Evaluate #if conditions when looking for libraries, so BLE libs are only
; pulled into the spike builds.
[env:spike-baseline]
extends = env:m5stack-fire
lib_ldf_mode = chain+
build_flags = ${env:m5stack-fire.build_flags} -DKC_BLE_SPIKE=0

[env:spike-bluedroid]
extends = env:m5stack-fire
lib_ldf_mode = chain+
build_flags = ${env:m5stack-fire.build_flags} -DKC_BLE_SPIKE=1

[env:spike-nimble]
extends = env:m5stack-fire
lib_ldf_mode = chain+
build_flags = ${env:m5stack-fire.build_flags} -DKC_BLE_SPIKE=2
lib_deps =
    ${env:m5stack-fire.lib_deps}
    h2zero/NimBLE-Arduino@1.4.3
